<!-- CAIXA FLUTUANTE DO ANÚNCIO -->
<div id="anuncio-flutuante" class="anuncio-flutuante">
    
    <button id="fechar-anuncio" class="fechar-anuncio" aria-label="Fechar anúncio">
        ✕
    </button>

    <div class="conteudo-anuncio">
        <script>
          atOptions = {
            'key' : 'f91292284fc8fd9b107d47a6e274fe79',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>

        <script src="https://www.highrevenueformat.com/f91292284fc8fd9b107d47a6e274fe79/invoke.js"></script>
    </div>

</div>

<style>
    .anuncio-flutuante {
        position: fixed;
        right: 20px;
        bottom: 20px;

        width: 300px;
        min-height: 250px;

        background: #120303;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;

        padding: 5px;

        z-index: 999999;

        box-shadow: 
            0 15px 40px rgba(0, 0, 0, 0.6);

        animation: aparecerAnuncio 0.4s ease;
    }

    .conteudo-anuncio {
        width: 300px;
        height: 250px;
        overflow: hidden;
        border-radius: 8px;
    }

    .fechar-anuncio {
        position: absolute;

        top: -12px;
        right: -12px;

        width: 30px;
        height: 30px;

        border-radius: 50%;

        border: 1px solid rgba(255, 255, 255, 0.2);

        background: #990000;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 1000000;

        transition: 
            transform 0.2s ease,
            background 0.2s ease;
    }

    .fechar-anuncio:hover {
        background: #e53935;
        transform: scale(1.1);
    }

    @keyframes aparecerAnuncio {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* RESPONSIVIDADE PARA CELULAR */
    @media (max-width: 500px) {

        .anuncio-flutuante {
            right: 50%;
            transform: translateX(50%);
            bottom: 15px;
        }

    }
</style>

<script>
    document
        .getElementById("fechar-anuncio")
        .addEventListener("click", function () {

            const anuncio = document.getElementById("anuncio-flutuante");

            anuncio.style.opacity = "0";
            anuncio.style.transform = "translateY(30px)";

            setTimeout(() => {
                anuncio.remove();
            }, 250);

        });
</script>
