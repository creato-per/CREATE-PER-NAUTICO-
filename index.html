<script>

    let elenco = [];

    let scouts = [];


    /* =========================
       FONTES DOS DADOS
    ========================= */

    const fontes = {

        elenco: [

            "https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Elenco.json",

            "Elenco.json",

            "elenco.json"

        ],


        dados: [

            "https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Dados.json",

            "Dados.json",

            "dados.json"

        ]

    };


    /* =========================
       NORMALIZAR TEXTO
    ========================= */

    function normalizarTexto(texto) {

        return String(
            texto || ""
        )

        .normalize(
            "NFD"
        )

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim()

        .toLowerCase();

    }


    /* =========================
       BUSCAR COM FALLBACK
    ========================= */

    async function buscarComFallback(listaDeURLs) {

        let ultimoErro;


        for (

            const url

            of

            listaDeURLs

        ) {

            try {

                console.log(

                    "Tentando carregar:",

                    url

                );


                const resposta =

                    await fetch(

                        url,

                        {

                            cache:
                                "no-store"

                        }

                    );


                if (

                    !resposta.ok

                ) {

                    throw new Error(

                        `HTTP ${resposta.status}`

                    );

                }


                const dados =

                    await resposta.json();


                console.log(

                    "Dados carregados com sucesso:",

                    url

                );


                return dados;

            }


            catch (erro) {

                console.warn(

                    "Falha ao carregar:",

                    url,

                    erro

                );


                ultimoErro =
                    erro;

            }

        }


        throw new Error(

            "Nenhuma fonte respondeu corretamente. " +

            (

                ultimoErro

                ? ultimoErro.message

                : ""

            )

        );

    }


    /* =========================
       CARREGAR DADOS
    ========================= */

    async function carregarDados() {

        const grid =

            document.getElementById(

                "grid-cards"

            );


        grid.innerHTML = `

            <div class="empty-state">

                Carregando dados dos atletas...

            </div>

        `;


        try {

            const [

                dadosElenco,

                dadosScout

            ] =

            await Promise.all([

                buscarComFallback(

                    fontes.elenco

                ),

                buscarComFallback(

                    fontes.dados

                )

            ]);


            /* =========================
               VALIDAR ELENCO
            ========================= */

            if (

                !dadosElenco

                ||

                !Array.isArray(

                    dadosElenco.atletas

                )

            ) {

                throw new Error(

                    "Os dados do elenco não possuem um array válido chamado 'atletas'."

                );

            }


            /* =========================
               VALIDAR SCOUT
            ========================= */

            if (

                !dadosScout

                ||

                !Array.isArray(

                    dadosScout.atletas

                )

            ) {

                throw new Error(

                    "Os dados do scout não possuem um array válido chamado 'atletas'."

                );

            }


            elenco =

                dadosElenco.atletas;


            scouts =

                dadosScout.atletas;


            console.log(

                "TOTAL DE ATLETAS:",

                elenco.length

            );


            console.log(

                "TOTAL DE SCOUTS:",

                scouts.length

            );


            if (

                elenco.length === 0

            ) {

                throw new Error(

                    "O arquivo do elenco foi carregado, mas não possui atletas."

                );

            }


            renderizar();

        }


        catch (erro) {

            console.error(

                "ERRO CRÍTICO:",

                erro

            );


            grid.innerHTML = `

                <div
                    class="empty-state"
                    style="
                        color:#ff8a8a;
                        font-style:normal;
                    "
                >

                    <strong>

                        Erro ao carregar os atletas.

                    </strong>

                    <br><br>

                    ${erro.message}

                </div>

            `;

        }

    }


    /* =========================
       ENCONTRAR SCOUT
    ========================= */

    function pegarScout(nome) {

        const nomeNormalizado =

            normalizarTexto(
                nome
            );


        const jogadorEncontrado =

            scouts.find(

                jogador =>

                    normalizarTexto(

                        jogador.nome

                    )

                    ===

                    nomeNormalizado

            );


        return (

            jogadorEncontrado

            ||

            {

                jogos:
                    0,

                participacao_em_gol:
                    0,

                bloqueio:
                    0,

                desarme:
                    0,

                chance_criada:
                    0,

                drible_certo:
                    0,

                chute:
                    0,

                chute_no_gol:
                    0

            }

        );

    }


    /* =========================
       RENDERIZAR
    ========================= */

    function renderizar() {

        const grid =

            document.getElementById(

                "grid-cards"

            );


        const campoPesquisa =

            document.getElementById(

                "pesquisa"

            );


        const selectPosicao =

            document.getElementById(

                "posicao"

            );


        const pesquisa =

            normalizarTexto(

                campoPesquisa
                    ? campoPesquisa.value
                    : ""

            );


        const filtroPosicao =

            selectPosicao
                ? selectPosicao.value
                : "";


        const jogadoresFiltrados =

            elenco.filter(

                jogador => {

                    if (

                        !jogador

                        ||

                        !jogador.nome

                    ) {

                        return false;

                    }


                    const nome =

                        normalizarTexto(

                            jogador.nome

                        );


                    const posicao =

                        String(

                            jogador.posicao || ""

                        )

                        .trim();


                    const passaPesquisa =

                        nome.includes(

                            pesquisa

                        );


                    const passaPosicao =

                        !filtroPosicao

                        ||

                        posicao ===

                        filtroPosicao;


                    return (

                        passaPesquisa

                        &&

                        passaPosicao

                    );

                }

            );


        grid.innerHTML = "";


        if (

            jogadoresFiltrados.length === 0

        ) {

            grid.innerHTML = `

                <div class="empty-state">

                    Nenhum atleta encontrado.

<script>

    document

        .addEventListener(

            "click",

            function () {


                const anuncio =

                    document.getElementById(

                        "anuncio-flutuante"

                    );


                const overlay =

                    document.getElementById(

                        "overlay-anuncio"

                    );


                anuncio.style.opacity =
                    "0";


                anuncio.style.transform =

                    "translate(-50%, -45%) scale(0.95)";


                overlay.style.opacity =
                    "0";


                setTimeout(

                    () => {

                        anuncio.remove();

                        overlay.remove();

                    },

                    300

                );

            }

        );
