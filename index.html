<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Per Náutico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #120303; color: #f9f9f9; font-family: 'Inter', sans-serif; min-height: 100vh; }
        header { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .logo h1 { font-size: 32px; font-weight: 800; color: #ff8a8a; }
        .logo p { margin-top: 4px; font-size: 14px; color: rgba(255,255,255,0.6); text-transform: uppercase; }
        .filtros { max-width: 1200px; width: 100%; margin: 20px auto; padding: 0 20px; display: flex; gap: 16px; flex-wrap: wrap; }
        input, select { background: rgba(255,255,255,0.03); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; font-size: 14px; }
        input { flex: 1; min-width: 260px; }
        select { min-width: 220px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; }
        .card h3 { font-size: 18px; margin-bottom: 8px; }
        .posicao { display: inline-block; font-size: 11px; background: rgba(255,255,255,0.06); padding: 5px 10px; border-radius: 20px; margin-bottom: 16px; }
        .badge { font-size: 28px; font-weight: 800; color: #ff8a8a; margin-bottom: 16px; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 16px; text-align: center; }
        .metric-val { font-size: 12px; }
        .empty { grid-column: 1/-1; text-align: center; padding: 50px; color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Create Per Náutico</h1>
            <p>Scout • Elenco Intelligence</p>
        </div>
    </header>

    <section class="filtros">
        <input type="text" id="pesquisa" placeholder="Pesquisar atleta...">
        <select id="posicao">
            <option value="">Todas as posições</option>
            <option value="Goleiro">Goleiro</option>
            <option value="Defensor">Defensor</option>
            <option value="Meio-Campista">Meio-Campista</option>
            <option value="Atacante">Atacante</option>
        </select>
    </section>

    <main class="container">
        <div id="grid" class="grid">
            <div class="empty">Carregando dados...</div>
        </div>
    </main>

    <script>
        let elenco = [];
        let scouts = [];

        async function carregarDados() {
            try {
                const elencoUrl = 'https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Elenco.json';
                const dadosUrl = 'https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Dados.json';

                const [r1, r2] = await Promise.all([
                    fetch(elencoUrl),
                    fetch(dadosUrl)
                ]);

                if (!r1.ok || !r2.ok) throw new Error('Erro ao carregar');

                elenco = (await r1.json()).atletas || [];
                scouts = (await r2.json()).atletas || [];

                renderizar();
            } catch(e) {
                document.getElementById('grid').innerHTML = '<div class="empty">Erro ao carregar dados</div>';
                console.error(e);
            }
        }

        function pegarScout(nome) {
            return scouts.find(s => s.nome.toLowerCase() === nome.toLowerCase()) || {
                jogos: 0, participacao_em_gol: 0, bloqueio: 0, desarme: 0, chance_criada: 0, drible_certo: 0, chute: 0, chute_no_gol: 0
            };
        }

        function renderizar() {
            const grid = document.getElementById('grid');
            const pesquisa = document.getElementById('pesquisa').value.toLowerCase();
            const posicao = document.getElementById('posicao').value;

            let filtrados = elenco.filter(j => {
                const nomeOk = j.nome.toLowerCase().includes(pesquisa);
                const posicaoOk = !posicao || j.posicao === posicao;
                return nomeOk && posicaoOk;
            });

            if (!filtrados.length) {
                grid.innerHTML = '<div class="empty">Nenhum atleta encontrado</div>';
                return;
            }

            grid.innerHTML = filtrados.map(j => {
                const s = pegarScout(j.nome);
                const p = j.ultima_partida || {};
                return `
                    <div class="card">
                        <h3>${j.nome}</h3>
                        <div class="posicao">${j.posicao}</div>
                        <div class="badge">${p.geral || 0}%</div>
                        <div class="metrics">
                            <div><small>P.A.</small><div class="metric-val">${p.participacao_ofensiva || 0}</div></div>
                            <div><small>P.C.</small><div class="metric-val">${p.participacao_criativa || 0}</div></div>
                            <div><small>P.O.</small><div class="metric-val">${p.participacao_defensiva || 0}</div></div>
                        </div>
                        <small><b>Jogos:</b> ${s.jogos} | <b>Part. Gol:</b> ${s.participacao_em_gol} | <b>Bloqueio:</b> ${s.bloqueio}</small>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('pesquisa').addEventListener('input', renderizar);
        document.getElementById('posicao').addEventListener('change', renderizar);

        carregarDados();
    </script>
</body>
</html>
