<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Per | Náutico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #990000;
            --primary-dark: #660000;
            --primary-light: #b31414;
            --bg-main: #120303;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f9f9f9;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #e53935;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #300606 0%, var(--bg-main) 70%);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 40px 20px 20px;
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #ff8a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .filtros {
            max-width: 1320px;
            width: 100%;
            margin: 10px auto 30px;
            padding: 0 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        input, select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        input:hover, select:hover {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.05);
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        input {
            flex: 1;
            min-width: 260px;
        }

        select {
            min-width: 220px;
            cursor: pointer;
        }

        select option {
            background: #1f0505;
            color: var(--text-main);
            padding: 10px;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .container {
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 60px;
            flex: 1;
        }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            min-width: 1250px;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 18px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        .posicao {
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .destaque {
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #fff 0%, #ffc5c5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state {
            text-align: center;
            padding: 40px !important;
            color: var(--text-muted);
            font-style: italic;
        }

        footer {
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            header { padding: 25px 20px 10px; }
            .logo h1 { font-size: 26px; }
            .filtros { padding: 0 16px; gap: 12px; }
            .container { padding: 0 16px 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Create Per Náutico</h1>
            <p>Scout • Elenco Intelligence</p>
        </div>
    </header>

    <section class="filtros">
        <input type="text" id="pesquisa" placeholder="Pesquisar atleta pelo nome...">
        <select id="posicao">
            <option value="">Todas as posições</option>
            <option value="Goleiro">Goleiro</option>
            <option value="Defensor">Defensor</option>
            <option value="Meio-Campista">Meio-Campista</option>
            <option value="Atacante">Atacante</option>
        </select>
    </section>

    <main class="container">
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Atleta</th>
                        <th>Posição</th>
                        <th>Jogos</th>
                        <th>Participação em Gol</th>
                        <th>Bloqueio</th>
                        <th>Desarme</th>
                        <th>Chance Criada</th>
                        <th>Drible Certo</th>
                        <th>Chute</th>
                        <th>Chute no Gol</th>
                        <th>Defensiva</th>
                        <th>Criativa</th>
                        <th>Ofensiva</th>
                        <th>Geral</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                    <tr>
                        <td colspan="14" class="empty-state">Carregando dados dos atletas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Create Per Náutico • Football Data Intelligence</p>
    </footer>

    <script>
        let elenco = [];
        let scouts = [];

        async function carregarDados() {
            try {
                const [respostaElenco, respostaScout] = await Promise.all([
                    fetch("Elenco.json"),
                    fetch("Dados.json")
                ]);

                if (!respostaElenco.ok || !respostaScout.ok) {
                    throw new Error("Falha ao carregar os arquivos JSON.");
                }

                const dadosElenco = await respostaElenco.json();
                const dadosScout = await respostaScout.json();

                elenco = dadosElenco.atletas || [];
                scouts = dadosScout.atletas || [];

                renderizar();
            } catch (erro) {
                console.error("Erro ao carregar arquivos locais:", erro);
                document.getElementById("tabela").innerHTML = `
                    <tr>
                        <td colspan="14" class="empty-state" style="color: #ff8a8a;">
                            Erro ao carregar os dados. Verifique se os arquivos <strong>Elenco.json</strong> e <strong>Dados.json</strong> estão na mesma pasta e se você está rodando o projeto por um servidor local (Live Server).
                        </td>
                    </tr>
                `;
            }
        }

        function pegarScout(nome) {
            return scouts.find(
                jogador => jogador.nome.toLowerCase() === nome.toLowerCase()
            ) || {
                jogos: 0,
                participacao_em_gol: 0,
                bloqueio: 0,
                desarme: 0,
                chance_criada: 0,
                drible_certo: 0,
                chute: 0,
                chute_no_gol: 0
            };
        }

        function renderizar() {
            const tabela = document.getElementById("tabela");
            const pesquisa = document.getElementById("pesquisa").value.toLowerCase().trim();
            const filtroPosicao = document.getElementById("posicao").value;

            tabela.innerHTML = "";

            const jogadoresFiltrados = elenco.filter(jogador => {
                const nome = jogador.nome.toLowerCase();
                const passaPesquisa = nome.includes(pesquisa);
                const passaPosicao = filtroPosicao === "" || jogador.posicao === filtroPosicao;

                return passaPesquisa && passaPosicao;
            });

            if (jogadoresFiltrados.length === 0) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="14" class="empty-server empty-state">Nenhum atleta encontrado.</td>
                    </tr>
                `;
                return;
            }

            jogadoresFiltrados.forEach(jogador => {
                const scout = pegarScout(jogador.nome);
                const partida = jogador.ultima_partida || {};

                const defensiva = partida.participacao_defensiva || 0;
                const criativa = partida.participacao_criativa || 0;
                const ofensiva = partida.participacao_ofensiva || 0;
                const geral = partida.geral || 0;

                tabela.innerHTML += `
                    <tr>
                        <td><strong>${jogador.nome}</strong></td>
                        <td><span class="posicao">${jogador.posicao}</span></td>
                        <td>${scout.jogos}</td>
                        <td class="destaque">${scout.participacao_em_gol}</td>
                        <td>${scout.bloqueio}</td>
                        <td>${scout.desarme}</td>
                        <td>${scout.chance_criada}</td>
                        <td>${scout.drible_certo}</td>
                        <td>${scout.chute}</td>
                        <td>${scout.chute_no_gol}</td>
                        <td>${defensiva}</td>
                        <td>${criativa}</td>
                        <td>${ofensiva}</td>
                        <td class="destaque">${geral}</td>
                    </tr>
                `;
            });
        }

        document.getElementById("pesquisa").addEventListener("input", renderizar);
        document.getElementById("posicao").addEventListener("change", renderizar);

        carregarDados();
    </script>
</body>
</html>
