<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Per | Náutico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #990000;
            --primary-dark: #660000;
            --primary-light: #b31414;
            --bg-main: #120303;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f9f9f9;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #e53935;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #300606 0%, var(--bg-main) 70%);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 40px 20px 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #ff8a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .filtros {
            max-width: 1200px;
            width: 100%;
            margin: 10px auto 30px;
            padding: 0 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        input, select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        input:hover, select:hover {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.05);
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        input {
            flex: 1;
            min-width: 260px;
        }

        select {
            min-width: 220px;
            cursor: pointer;
        }

        select option {
            background: #1f0505;
            color: var(--text-main);
            padding: 10px;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 60px;
            flex: 1;
        }

        /* GRID DE CARDS */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        /* CARD INDIVIDUAL */
        .card-atleta {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .card-atleta:hover {
            border-color: var(--border-focus);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .posicao {
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            display: inline-block;
            color: var(--text-muted);
        }

        .badge-geral {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ff8a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* PARTICIPAÇÕES (P.A., P.C., P.O.) */
        .card-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .metric-item span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .metric-item strong {
            font-size: 15px;
            color: #fff;
        }

        /* DETAILS (MENU SUSPENSO / ACCORDION) */
        details {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        summary {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            transition: color 0.2s;
        }

        summary:hover {
            color: #ff6b6b;
        }

        summary::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            transform: rotate(180deg);
        }

        .details-content {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .stat-box span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-box strong {
            font-size: 14px;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-style: italic;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        /* CAIXA FLUTUANTE (ADS / WIDGET) */
        .floating-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 6, 6, 0.95);
            border: 1px solid var(--border-focus);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: 330px;
            animation: slideUp 0.3s ease;
        }

        .floating-close {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .floating-close:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .floating-content {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            header { padding: 25px 20px 10px; }
            .logo h1 { font-size: 26px; }
            .filtros { padding: 0 16px; gap: 12px; }
            .container { padding: 0 16px 40px; }
            .grid-cards { grid-template-columns: 1fr; }
            .floating-box { bottom: 10px; right: 10px; left: 10px; max-width: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Create Per Náutico</h1>
            <p>Scout • Elenco Intelligence</p>
        </div>
    </header>

    <section class="filtros">
        <input type="text" id="pesquisa" placeholder="Pesquisar atleta pelo nome...">
        <select id="posicao">
            <option value="">Todas as posições</option>
            <option value="Goleiro">Goleiro</option>
            <option value="Defensor">Defensor</option>
            <option value="Meio-Campista">Meio-Campista</option>
            <option value="Atacante">Atacante</option>
        </select>
    </section>

    <main class="container">
        <div id="grid-cards" class="grid-cards">
            <div class="empty-state">Carregando dados dos atletas...</div>
        </div>
    </main>

    <!-- CAIXA FLUTUANTE COM BOTÃO X -->
    <div id="floatingAdBox" class="floating-box">
        <button class="floating-close" onclick="fecharCaixaFlutuante()" title="Fechar">✕</button>
        <div class="floating-content">
            <script>
              atOptions = {
                'key' : 'f91292284fc8fd9b107d47a6e274fe79',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/f91292284fc8fd9b107d47a6e274fe79/invoke.js"></script>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Create Per Náutico • Football Data Intelligence</p>
    </footer>

    <script>
        function fecharCaixaFlutuante() {
            const caixa = document.getElementById('floatingAdBox');
            if (caixa) {
                caixa.style.display = 'none';
            }
        }

        let elenco = [];
        let scouts = [];

        async function carregarDados() {
            try {
                const [respostaElenco, respostaScout] = await Promise.all([
                    fetch("Elenco.json"),
                    fetch("Dados.json")
                ]);

                if (!respostaElenco.ok || !respostaScout.ok) {
                    throw new Error("Falha ao carregar os arquivos JSON.");
                }

                const dadosElenco = await respostaElenco.json();
                const dadosScout = await respostaScout.json();

                elenco = dadosElenco.atletas || [];
                scouts = dadosScout.atletas || [];

                renderizar();
            } catch (erro) {
                console.error("Erro ao carregar arquivos locais:", erro);
                document.getElementById("grid-cards").innerHTML = `
                    <div class="empty-state" style="color: #ff8a8a;">
                        Erro ao carregar os dados. Verifique se os arquivos <strong>Elenco.json</strong> e <strong>Dados.json</strong> estão na mesma pasta e se você está rodando o projeto por um servidor local (Live Server).
                    </div>
                `;
            }
        }

        function pegarScout(nome) {
            return scouts.find(
                jogador => jogador.nome.toLowerCase() === nome.toLowerCase()
            ) || {
                jogos: 0,
                participacao_em_gol: 0,
                bloqueio: 0,
                desarme: 0,
                chance_criada: 0,
                drible_certo: 0,
                chute: 0,
                chute_no_gol: 0
            };
        }

        function renderizar() {
            const grid = document.getElementById("grid-cards");
            const pesquisa = document.getElementById("pesquisa").value.toLowerCase().trim();
            const filtroPosicao = document.getElementById("posicao").value;

            grid.innerHTML = "";

            const jogadoresFiltrados = elenco.filter(jogador => {
                const nome = jogador.nome.toLowerCase();
                const passaPesquisa = nome.includes(pesquisa);
                const passaPosicao = filtroPosicao === "" || jogador.posicao === filtroPosicao;

                return passaPesquisa && passaPosicao;
            });

            if (jogadoresFiltrados.length === 0) {
                grid.innerHTML = `<div class="empty-state">Nenhum atleta encontrado.</div>`;
                return;
            }

            jogadoresFiltrados.forEach(jogador => {
                const scout = pegarScout(jogador.nome);
                const partida = jogador.ultima_partida || {};

                const defensiva = partida.participacao_defensiva || 0;
                const criativa = partida.participacao_criativa || 0;
                const ofensiva = partida.participacao_ofensiva || 0;
                const geral = partida.geral || 0;

                grid.innerHTML += `
                    <div class="card-atleta">
                        <div class="card-header">
                            <div class="card-info">
                                <h3>${jogador.nome}</h3>
                                <span class="posicao">${jogador.posicao}</span>
                            </div>
                            <div class="badge-geral">${geral}%</div>
                        </div>

                        <div class="card-metrics">
                            <div class="metric-item">
                                <span>P.A.</span>
                                <strong>${ofensiva}</strong>
                            </div>
                            <div class="metric-item">
                                <span>P.C.</span>
                                <strong>${criativa}</strong>
                            </div>
                            <div class="metric-item">
                                <span>P.O.</span>
                                <strong>${defensiva}</strong>
                            </div>
                        </div>

                        <details>
                            <summary>Ficha completa *Dados.json</summary>
                            <div class="details-content">
                                <div class="stat-box">
                                    <span>Jogos</span>
                                    <strong>${scout.jogos}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Part. Gol</span>
                                    <strong>${scout.participacao_em_gol}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Bloqueio</span>
                                    <strong>${scout.bloqueio}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Desarme</span>
                                    <strong>${scout.desarme}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Chance Criada</span>
                                    <strong>${scout.chance_criada}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Drible Certo</span>
                                    <strong>${scout.drible_certo}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Chute</span>
                                    <strong>${scout.chute}</strong>
                                </div>
                                <div class="stat-box">
                                    <span>Chute no Gol</span>
                                    <strong>${scout.chute_no_gol}</strong>
                                </div>
                            </div>
                        </details>
                    </div>
                `;
            });
        }

        document.getElementById("pesquisa").addEventListener("input", renderizar);
        document.getElementById("posicao").addEventListener("change", renderizar);

        carregarDados();
    </script>
</body>
</html>
