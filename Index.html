<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DATA 6 | Scout</title><style>

</option></select></section><!-- CONTEÚDO --><main class="container"><div class="tabela-container"><table><thead><tr><th>Atleta</th><th>Posição</th><th>Jogos</th><th>Participação em Gol</th><th>Bloqueios</th><th>Desarmes</th><th>Chances Criadas</th><th>Dribles Certos</th><th>Chutes</th><th>Chutes no Gol</th><th>Defensiva</th><th>Criativa</th><th>Ofensiva</th><th>Geral</th></tr></thead><tbody id="tabela"></tbody></table></div></main><footer>DATA 6 • NÚMEROS DO HEXA

</footer><script>


let elenco = [];

let scouts = [];


/* CARREGAR DADOS */


async function carregarDados() {


    try {


        const respostaElenco =
            await fetch("elenco.json");


        const dadosElenco =
            await respostaElenco.json();


        elenco =
            dadosElenco.atletas;



        const respostaScout =
            await fetch("dados.json");


        const dadosScout =
            await respostaScout.json();


        scouts =
            dadosScout.atletas;



        renderizar();


    }


    catch (erro) {


        console.error(erro);


        document
            .getElementById("tabela")
            .innerHTML = `

            <tr>

            <td colspan="14">

            Erro ao carregar os dados.

            </td>

            </tr>

            `;


    }


}



/* BUSCAR SCOUT */


function pegarScout(nome) {


    return scouts.find(


        jogador =>


        jogador.nome
        .toLowerCase()
        ===
        nome.toLowerCase()


    )


    ||

    {


        jogos: 0,

        participacao_em_gol: 0,

        bloqueio: 0,

        desarme: 0,

        chance_criada: 0,

        drible_certo: 0,

        chute: 0,

        chute_no_gol: 0


    };


}



/* RENDERIZAR TABELA */


function renderizar() {


    const tabela =

        document
        .getElementById("tabela");


    const pesquisa =

        document
        .getElementById("pesquisa")
        .value
        .toLowerCase();


    const filtroPosicao =

        document
        .getElementById("posicao")
        .value;



    tabela.innerHTML = "";



    elenco


    .filter(jogador => {


        const nome =

            jogador.nome
            .toLowerCase();



        const passaPesquisa =

            nome.includes(
                pesquisa
            );



        const passaPosicao =

            filtroPosicao === ""

            ||

            jogador.posicao
            ===
            filtroPosicao;



        return

            passaPesquisa

            &&

            passaPosicao;


    })


    .forEach(jogador => {


        const scout =

            pegarScout(
                jogador.nome
            );



        const partida =

            jogador.ultima_partida;



        const defensiva =

            partida
            .participacao_defensiva

            ||

            0;



        const criativa =

            partida
            .participacao_criativa

            ||

            0;



        const ofensiva =

            partida
            .participacao_ofensiva

            ||

            0;



        const geral =

            partida.geral

            ||

            0;



        tabela.innerHTML += `


        <tr>


        <td>

        <strong>

        ${jogador.nome}

        </strong>

        </td>



        <td>

        <span class="posicao">

        ${jogador.posicao}

        </span>

        </td>



        <td>

        ${scout.jogos}

        </td>



        <td class="destaque">

        ${scout.participacao_em_gol}

        </td>



        <td>

        ${scout.bloqueio}

        </td>



        <td>

        ${scout.desarme}

        </td>



        <td>

        ${scout.chance_criada}

        </td>



        <td>

        ${scout.drible_certo}

        </td>



        <td>

        ${scout.chute}

        </td>



        <td>

        ${scout.chute_no_gol}

        </td>



        <td>

        ${defensiva}

        </td>



        <td>

        ${criativa}

        </td>



        <td>

        ${ofensiva}

        </td>



        <td class="destaque">

        ${geral}

        </td>


        </tr>


        `;


    });


}



/* EVENTOS */


document

.getElementById("pesquisa")

.addEventListener(

    "input",

    renderizar

);



document

.getElementById("posicao")

.addEventListener(

    "change",

    renderizar

);



/* INICIAR */


carregarDados();


</script></body></html>
