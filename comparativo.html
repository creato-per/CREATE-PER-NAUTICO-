<script>
    const urlElenco = 'https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Elenco.json';
    const urlDados = 'https://raw.githubusercontent.com/creato-per/CREATE-PER-NAUTICO-/main/Dados.json';

    let elencoGlobal = [];
    let scoutsGlobal = [];
    let meuGrafico = null;

    /* =========================================================
       CONFIGURAÇÃO DOS NOMES DAS 5 PARTIDAS
       Basta alterar os textos abaixo.
    ========================================================= */

    const nomesPartidas = [
        'Partida 1',
        'Partida 2',
        'Partida 3',
        'Partida 4',
        'Última Partida'
    ];

    /* =========================================================
       MÉTRICAS DISPONÍVEIS NO NOVO DADOS.JSON
    ========================================================= */

    const metricasRanking = {
        defesas_dificeis: {
            label: 'Defesas difíceis / Jogo',
            campo: 'defesas_dificeis',
            posicoes: ['Goleiro']
        },

        bolas_recuperadas: {
            label: 'Bolas recuperadas / Jogo',
            campo: 'bolas_recuperadas',
            posicoes: ['Goleiro']
        },

        gols_evitados: {
            label: 'Gols evitados / Jogo',
            campo: 'gols_evitados',
            posicoes: ['Goleiro', 'Defensor']
        },

        chutes_sofridos: {
            label: 'Chutes sofridos / Jogo',
            campo: 'chutes_sofridos',
            posicoes: ['Goleiro']
        },

        bloqueio: {
            label: 'Bloqueios / Jogo',
            campo: 'bloqueio',
            posicoes: ['Defensor']
        },

        desarme: {
            label: 'Desarmes / Jogo',
            campo: 'desarme',
            posicoes: ['Defensor']
        },

        gols_defensor: {
            label: 'Gols / Jogo',
            campo: 'gols',
            posicoes: ['Defensor']
        },

        bolas_para_gol_defensor: {
            label: 'Bolas para gol / Jogo',
            campo: 'bolas_para_gol',
            posicoes: ['Defensor']
        },

        chance_criada: {
            label: 'Chances criadas / Jogo',
            campo: 'chance_criada',
            posicoes: ['Meio-Campista', 'Atacante']
        },

        drible_certo: {
            label: 'Dribles certos / Jogo',
            campo: 'drible_certo',
            posicoes: ['Meio-Campista', 'Atacante']
        },

        gols_meio_ataque: {
            label: 'Gols / Jogo',
            campo: 'gols',
            posicoes: ['Meio-Campista', 'Atacante']
        },

        bolas_para_gol_meio_ataque: {
            label: 'Bolas para gol / Jogo',
            campo: 'bolas_para_gol',
            posicoes: ['Meio-Campista', 'Atacante']
        },

        gols_perdidos: {
            label: 'Gols perdidos / Jogo',
            campo: 'gols_perdidos',
            posicoes: ['Meio-Campista', 'Atacante']
        }
    };

    /* =========================================================
       CARREGAMENTO DOS DADOS
    ========================================================= */

    async function carregarDadosPagina() {

        try {

            const [respElenco, respScout] = await Promise.all([
                fetch(urlElenco + '?v=' + Date.now(), {
                    cache: 'no-store'
                }),

                fetch(urlDados + '?v=' + Date.now(), {
                    cache: 'no-store'
                })
            ]);

            if (!respElenco.ok) {
                throw new Error(
                    `Elenco.json retornou HTTP ${respElenco.status}`
                );
            }

            if (!respScout.ok) {
                throw new Error(
                    `Dados.json retornou HTTP ${respScout.status}`
                );
            }

            const dadosElenco = await respElenco.json();
            const dadosScout = await respScout.json();

            if (!Array.isArray(dadosElenco.atletas)) {
                throw new Error(
                    'Elenco.json não possui um array "atletas".'
                );
            }

            if (!Array.isArray(dadosScout.atletas)) {
                throw new Error(
                    'Dados.json não possui um array "atletas".'
                );
            }

            elencoGlobal = dadosElenco.atletas;
            scoutsGlobal = dadosScout.atletas;

            popularSelectsJogadores();
            inicializarGraficoVazio();
            renderizarRanking();

        } catch (erro) {

            console.error("Erro completo:", erro);

            document.getElementById("corpoRanking").innerHTML = `
                <tr>
                    <td colspan="6"
                        class="empty-state"
                        style="color: #ff8a8a;">
                        Erro ao carregar os dados.<br>
                        <small>${erro.message}</small>
                    </td>
                </tr>
            `;
        }
    }

    /* =========================================================
       SELECT DOS JOGADORES
    ========================================================= */

    function popularSelectsJogadores() {

        const select1 = document.getElementById("jogador1");
        const select2 = document.getElementById("jogador2");

        const atletasOrdenados = [...elencoGlobal]
            .sort((a, b) => a.nome.localeCompare(b.nome));

        let optionsHtml = '<option value="">Nenhum</option>';

        atletasOrdenados.forEach(atleta => {

            optionsHtml += `
                <option value="${atleta.nome}">
                    ${atleta.nome} (${atleta.posicao})
                </option>
            `;
        });

        select1.innerHTML = optionsHtml;
        select2.innerHTML = optionsHtml;

        if (atletasOrdenados.length > 0) {
            select1.value = atletasOrdenados[0].nome;
        }

        if (atletasOrdenados.length > 1) {
            select2.value = atletasOrdenados[1].nome;
        }

        atualizarGrafico();
    }

    /* =========================================================
       HISTÓRICO DOS ÚLTIMOS 5 JOGOS
    ========================================================= */

    function obterHistoricoPartidas(atletaObj) {

        if (
            atletaObj &&
            Array.isArray(atletaObj.ultimos_5_jogos)
        ) {

            const historico = atletaObj.ultimos_5_jogos
                .slice(-5);

            while (historico.length < 5) {
                historico.unshift(0);
            }

            return historico;
        }

        return [0, 0, 0, 0, 0];
    }

    /* =========================================================
       GRÁFICO
    ========================================================= */

    function inicializarGraficoVazio() {

        const ctx = document
            .getElementById('graficoComparativo')
            .getContext('2d');

        meuGrafico = new Chart(ctx, {

            type: 'line',

            data: {
                labels: nomesPartidas,
                datasets: []
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        labels: {
                            color: '#f9f9f9',
                            font: {
                                family: 'Inter',
                                size: 12
                            }
                        }
                    }
                },

                scales: {

                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        },

                        ticks: {
                            color: 'rgba(255, 255, 255, 0.6)'
                        }
                    },

                    y: {

                        min: 0,
                        max: 100,

                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        },

                        ticks: {
                            color: 'rgba(255, 255, 255, 0.6)'
                        }
                    }
                }
            }
        });
    }

    function atualizarGrafico() {

        const nome1 =
            document.getElementById("jogador1").value;

        const nome2 =
            document.getElementById("jogador2").value;

        let datasets = [];

        if (nome1) {

            const atletaObj =
                elencoGlobal.find(a => a.nome === nome1);

            const historico =
                obterHistoricoPartidas(atletaObj);

            datasets.push({

                label: nome1,

                data: historico,

                borderColor: '#e53935',

                backgroundColor:
                    'rgba(229, 57, 53, 0.1)',

                borderWidth: 3,

                tension: 0.3,

                fill: true
            });
        }

        if (nome2) {

            const atletaObj =
                elencoGlobal.find(a => a.nome === nome2);

            const historico =
                obterHistoricoPartidas(atletaObj);

            datasets.push({

                label: nome2,

                data: historico,

                borderColor: '#3b82f6',

                backgroundColor:
                    'rgba(59, 130, 246, 0.1)',

                borderWidth: 3,

                tension: 0.3,

                fill: true
            });
        }

        if (meuGrafico) {

            meuGrafico.data.labels =
                nomesPartidas;

            meuGrafico.data.datasets =
                datasets;

            meuGrafico.update();
        }
    }

    /* =========================================================
       ATUALIZA AS MÉTRICAS DO SELECT
    ========================================================= */

    function atualizarOpcoesRanking() {

        const select =
            document.getElementById("metricaRanking");

        const posicoesExistentes =
            [...new Set(
                scoutsGlobal.map(s => s.posicao)
            )];

        let html = '';

        Object.entries(metricasRanking)
            .forEach(([chave, metrica]) => {

                const existePosicao =
                    metrica.posicoes.some(posicao =>
                        posicoesExistentes.includes(posicao)
                    );

                if (existePosicao) {

                    html += `
                        <option value="${chave}">
                            ${metrica.label}
                        </option>
                    `;
                }
            });

        select.innerHTML = html;
    }

    /* =========================================================
       RANKING PER GAME
    ========================================================= */

    function renderizarRanking() {

        const metrica =
            document.getElementById(
                "metricaRanking"
            ).value;

        const corpo =
            document.getElementById(
                "corpoRanking"
            );

        const labelColuna =
            document.getElementById(
                "labelMediaColuna"
            );

        const configuracao =
            metricasRanking[metrica];

        if (!configuracao) {

            corpo.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="empty-state">
                        Nenhuma métrica selecionada.
                    </td>
                </tr>
            `;

            return;
        }

        labelColuna.innerText =
            configuracao.label;

        const listaCalculada =
            elencoGlobal

                .map(atleta => {

                    const scout =
                        scoutsGlobal.find(
                            s =>
                                s.nome &&
                                atleta.nome &&
                                s.nome.toLowerCase() ===
                                atleta.nome.toLowerCase()
                        );

                    if (!scout) {
                        return null;
                    }

                    /*
                     * Evita colocar jogadores de outras
                     * posições em métricas incompatíveis.
                     */

                    if (
                        !configuracao.posicoes.includes(
                            atleta.posicao
                        )
                    ) {
                        return null;
                    }

                    const totalJogos =
                        Number(scout.jogos) || 0;

                    const totalAtributo =
                        Number(
                            scout[configuracao.campo]
                        ) || 0;

                    const mediaPerGame =
                        totalJogos > 0
                            ? totalAtributo / totalJogos
                            : 0;

                    return {

                        nome: atleta.nome,

                        posicao: atleta.posicao,

                        jogos: totalJogos,

                        total: totalAtributo,

                        media: mediaPerGame
                    };
                })

                .filter(Boolean)

                /*
                 * Jogadores sem partidas não entram
                 * no ranking.
                 */

                .filter(item => item.jogos > 0)

                .sort(
                    (a, b) =>
                        b.media - a.media
                );

        const top10 =
            listaCalculada.slice(0, 10);

        if (top10.length === 0) {

            corpo.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="empty-state">
                        Nenhum dado encontrado
                        para esta métrica.
                    </td>
                </tr>
            `;

            return;
        }

        let htmlTabela = '';

        top10.forEach((item, index) => {

            htmlTabela += `
                <tr>

                    <td class="posicao-num">
                        ${index + 1}º
                    </td>

                    <td>
                        <strong>
                            ${item.nome}
                        </strong>
                    </td>

                    <td>
                        <span style="
                            font-size: 11px;
                            padding: 4px 8px;
                            background:
                                rgba(255,255,255,0.06);
                            border-radius: 20px;
                            border:
                                1px solid var(--border);
                            color:
                                var(--text-muted);
                        ">
                            ${item.posicao}
                        </span>
                    </td>

                    <td>
                        ${item.jogos}
                    </td>

                    <td>
                        ${item.total}
                    </td>

                    <td>
                        <strong style="
                            color: var(--accent);
                        ">
                            ${item.media.toFixed(2)}
                        </strong>
                    </td>

                </tr>
            `;
        });

        corpo.innerHTML =
            htmlTabela;
    }

    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    async function iniciarPagina() {

        await carregarDadosPagina();

        /*
         * Só cria as opções depois que os dados
         * realmente foram carregados.
         */

        atualizarOpcoesRanking();

        renderizarRanking();
    }

    iniciarPagina();

</script>
